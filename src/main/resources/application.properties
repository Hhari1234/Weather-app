spring.application.name=Weather App

# ---------------------------------------------------------------------------
# OpenWeather API configuration
# The API key is ALWAYS read from an environment variable. Never commit a real
# key. For local development copy `.env.example` values into your environment
# (e.g. `export WEATHER_API_KEY=...` on Linux/macOS or `set WEATHER_API_KEY=...`
# on Windows) or set it in your IDE run configuration.
# ---------------------------------------------------------------------------
weather.api.key=${WEATHER_API_KEY:}
weather.api.base-url=https://api.openweathermap.org
weather.api.connect-timeout-ms=4000
weather.api.read-timeout-ms=8000

# ---------------------------------------------------------------------------
# Server
# Render injects the PORT environment variable; local dev defaults to 8080.
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.error.whitelabel.enabled=false

# Dev convenience: re-resolve templates on change (set to true in production if desired)
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------------
# Actuator - health endpoint only, no sensitive info exposed
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.cache.enabled=false
