# Render blueprint - deploys the whole app (Thymeleaf + REST API) as ONE
# Spring Boot web service. See README "Deployment" section for manual steps.
#
# After the first deploy, set the WEATHER_API_KEY environment variable in the
# Render dashboard (Env Vars) and re-deploy.
services:
  - type: web
    name: weather-app
    runtime: java
    region: frankfurt # or ohio / singapore - pick the region closest to your users
    plan: free
    buildCommand: chmod +x mvnw && ./mvnw -B -DskipTests package
    startCommand: java -jar target/weather-app.jar
    healthCheckPath: /
    envVars:
      - key: WEATHER_API_KEY
        sync: false # set manually in the dashboard - never commit keys
