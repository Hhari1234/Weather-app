# Render Blueprint - deploys the whole app (Thymeleaf + REST API) as ONE
# Docker container running a Spring Boot JAR. See README "Deployment" section.
#
# After the first deploy, set the WEATHER_API_KEY environment variable in the
# Render dashboard (Env Vars) and re-deploy.
services:
  - type: web
    name: weather-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: WEATHER_API_KEY
        sync: false
